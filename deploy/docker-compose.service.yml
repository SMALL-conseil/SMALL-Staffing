# ============================================================
#  Blocs de service à GREFFER dans le compose central du VPS
#  (/opt/small/deploy/docker-compose.prod.yml) — cf. deploy/SETUP.md.
#  Le VPS mutualisé fournit déjà : traefik (TLS Let's Encrypt),
#  postgres 16 partagé, réseaux web/internal.
#  Ne PAS lancer ce fichier tel quel : c'est un fragment.
# ============================================================

services:
  staffing:
    image: ${STAFFING_IMAGE}:${STAFFING_TAG:-latest}
    restart: unless-stopped
    env_file: [.env, staffing.env]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [web, internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.staffing.rule=Host(`${DOMAIN_STAFFING}`)
      - traefik.http.routers.staffing.entrypoints=websecure
      - traefik.http.routers.staffing.tls.certresolver=le
      - traefik.http.services.staffing.loadbalancer.server.port=3000
      - traefik.docker.network=staffings_web

  # PRÉPROD : même image, tag piloté par STAFFING_PREPROD_TAG, env surchargé,
  # porte BasicAuth Traefik (couple PREPROD_BASICAUTH du .env central,
  # format hash {SHA} OBLIGATOIRE — cf. SETUP.md).
  staffing-preprod:
    image: ${STAFFING_IMAGE}:${STAFFING_PREPROD_TAG:-preprod}
    restart: unless-stopped
    env_file: [.env, staffing.env, staffing.preprod.env]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [web, internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.staffing-preprod.rule=Host(`${DOMAIN_STAFFING_PREPROD}`)
      - traefik.http.routers.staffing-preprod.entrypoints=websecure
      - traefik.http.routers.staffing-preprod.tls.certresolver=le
      - traefik.http.routers.staffing-preprod.middlewares=preprod-auth
      - traefik.http.middlewares.preprod-auth.basicauth.users=${PREPROD_BASICAUTH}
      - traefik.http.services.staffing-preprod.loadbalancer.server.port=3000
      - traefik.docker.network=staffings_web

# Variables à AJOUTER au .env central du VPS :
#   STAFFING_IMAGE=ghcr.io/small-conseil/staffing
#   DOMAIN_STAFFING=staffing.small-conseil.com
#   DOMAIN_STAFFING_PREPROD=staffing-preprod.small-conseil.com
